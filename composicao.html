<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Composição | Nome do projeto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="composicao.js" defer></script>
</head>
<body>
  <header class="topo">
    <a class="logo" href="index.html">Nome do projeto</a>
  </header>

  <section class="banner">
    <div class="bannertexto">
      <h1 class="bannertitulo">Texto do banner</h1>
    </div>
    <!-- a imagem do banner entra aqui -->
    <div class="bannerimagem" aria-hidden="true"></div>
  </section>

  <nav class="menu" aria-label="Navegação principal">
    <a href="index.html" class="menulink">Visão geral</a>
    <a href="composicao.html" class="menulink menulink-ativo" aria-current="page">Composição</a>
    <a href="metodologia.html" class="menulink">Metodologia</a>
    <a href="sobre.html" class="menulink">Sobre</a>
  </nav>

  <main class="conteudo">
    <section class="secao" aria-label="Perfil por região e métricas do score">
      <div class="graficos">
        <div>
          <h2 class="secaotitulo" id="titulo-perfil">Perfil por região</h2>
          <figure class="grafico grafico-alto" id="grafico-perfil" aria-labelledby="titulo-perfil">
            <!-- O gráfico (imagem, SVG ou canvas) entra aqui -->
            <div class="graficoarea"></div>
          </figure>
        </div>

        <div>
          <h2 class="secaotitulo" id="titulo-metricas">Métricas e peso do score</h2>
          <figure class="grafico grafico-alto" id="grafico-metricas" aria-labelledby="titulo-metricas">
            <div class="graficoarea"></div>
          </figure>
        </div>
      </div>
    </section>

    <!-- clicar em "Ver análises" abre os outros gráficos do Colab -->
    <details class="analises" id="analises">
      <summary class="analisesresumo"><span class="botao">Ver análises</span></summary>
      <h2 class="soleitor">Outros gráficos do Colab</h2>

      <div class="graficos graficos-analises">
        <figure class="grafico grafico-solto" id="grafico-colab-1">
          <figcaption class="graficotitulo">Título do gráfico 1</figcaption>
          <div class="graficoarea"></div>
        </figure>

        <figure class="grafico grafico-solto" id="grafico-colab-2">
          <figcaption class="graficotitulo">Título do gráfico 2</figcaption>
          <div class="graficoarea"></div>
        </figure>

        <figure class="grafico grafico-solto" id="grafico-colab-3">
          <figcaption class="graficotitulo">Título do gráfico 3</figcaption>
          <div class="graficoarea"></div>
        </figure>

        <figure class="grafico grafico-solto" id="grafico-colab-4">
          <figcaption class="graficotitulo">Título do gráfico 4</figcaption>
          <div class="graficoarea"></div>
        </figure>
      </div>
    </details>
  </main>

  <footer class="rodape"></footer>
</body>
</html>
