<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Composição | C42</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="composicao.js" defer></script>
</head>
<body>
<section class="banner">
  <a class="bannerlogo" href="index.html">
    <img src="css/imagens/logo.png" alt="CREDIT42, ir para a visão geral">
  </a>
  <h1 class="bannertitulo">Composição e análise de indicadores</h1>
</section>
  <nav class="menu" aria-label="Navegação principal">
    <a href="index.html" class="menulink">Visão geral</a>
    <a href="composicao.html" class="menulink menulink-ativo" aria-current="page">Composição</a>
    <a href="metodologia.html" class="menulink">Metodologia</a>
    <a href="sobre.html" class="menulink">Sobre</a>
  </nav>
  <main class="conteudo">
    <section class="secao" aria-label="Perfil por região e métricas do score">
      <div class="graficos">
        <div>
          <h2 class="secaotitulo" id="titulo-perfil">Perfil por região</h2>
          <figure class="grafico grafico-alto" id="grafico-perfil" aria-labelledby="titulo-perfil">
            <div class="graficoarea"></div>
          </figure>
        </div>
        <div>
          <h2 class="secaotitulo" id="titulo-metricas">Métricas e peso do score</h2>
          <figure class="grafico grafico-alto" id="grafico-metricas" aria-labelledby="titulo-metricas">
            <div class="graficoarea"></div>
          </figure>
        </div>
      </div>
    </section>
    <details class="analises" id="analises">
      <summary class="analisesresumo"><span class="botao">Explorar análises</span></summary>
      <h2 class="soleitor">Explore a distribuição dos indicadores de crédito, compare o desempenho regional e analise as métricas utilizadas na avaliação de oportunidades.</h2>
      <div class="graficos graficos-analises">
        <figure class="grafico grafico-solto" id="grafico-colab-1">
          <figcaption class="graficotitulo">Evolução da carteira de crédito por região</figcaption>
          <div class="graficoarea"></div>
        </figure>
        <figure class="grafico grafico-solto" id="grafico-colab-2">
          <figcaption class="graficotitulo">Evolução do volume de transações Pix por região</figcaption>
          <div class="graficoarea"></div>
        </figure>
        <figure class="grafico grafico-solto" id="grafico-colab-3">
          <figcaption class="graficotitulo">Taxa de inadimplência por município</figcaption>
          <div class="graficoarea"></div>
        </figure>
        <figure class="grafico grafico-solto" id="grafico-colab-4">
          <figcaption class="graficotitulo">Ranking de município por score de oportunidade</figcaption>
          <div class="graficoarea"></div>
        </figure>
      </div>
    </details>
  </main>
  <footer class="rodape"></footer>
</body>
</html>
