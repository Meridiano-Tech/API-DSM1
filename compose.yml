services:
  db:
    image: mysql:8.0
    container_name: credit42_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bancosite.sql:/docker-entrypoint-initdb.d/bancosite.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - credit42_net

  app1:
    build: .
    image: credit42-app:latest
    container_name: credit42_app_1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - credit42_net

  app2:
    build: .
    image: credit42-app:latest
    container_name: credit42_app_2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - credit42_net

  nginx:
    image: nginx:alpine
    container_name: credit42_nginx
    restart: unless-stopped
    ports:
      - "8000:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - credit42_net

volumes:
  mysql_data:

networks:
  credit42_net: